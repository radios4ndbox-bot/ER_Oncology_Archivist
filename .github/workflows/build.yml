name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sintassi JavaScript
        run: |
          node --check main.js
          node --check preload.js
          node --check src/app.js
          node --check src/xlsx.js
          node --check src/names.js

      - name: Nessun gestore inline nell'HTML
        # La CSP vieta 'unsafe-inline' per gli script: un onclick="" nel
        # markup smetterebbe semplicemente di funzionare. Meglio fallire qui.
        run: |
          if grep -nE 'on(click|change|input|load|error|submit|focus|blur)=' src/index.html; then
            echo "::error::gestore di evento inline trovato in src/index.html"
            exit 1
          fi
          echo "OK: nessun gestore inline"

      - name: Nessuna risorsa remota
        # L'app deve funzionare offline dietro il proxy ospedaliero.
        run: |
          if grep -nE '(src|href)="https?://' src/index.html; then
            echo "::error::risorsa remota referenziata in src/index.html"
            exit 1
          fi
          echo "OK: nessuna risorsa remota"

      - name: Impostazioni di sicurezza Electron
        run: |
          for chiave in "contextIsolation: true" "nodeIntegration: false" "sandbox: true"; do
            grep -q "$chiave" main.js || { echo "::error::manca $chiave in main.js"; exit 1; }
          done
          echo "OK: webPreferences irrobustite"

  build:
    needs: verifica
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installazione dipendenze
        # npm ci usa package-lock.json: stesse versioni esatte della build
        # locale, nessuna sorpresa da un aggiornamento a monte.
        run: npm ci --no-audit --no-fund

      - name: Build portable + installer
        run: npx electron-builder --win portable nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblicazione artifact
        uses: actions/upload-artifact@v4
        with:
          name: ER-Oncology-Archivist-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
