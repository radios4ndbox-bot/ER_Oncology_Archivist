name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      rilascia:
        # Il push dei tag non sempre e' possibile (alcuni ambienti lo
        # rifiutano): con questa spunta la Release v<versione di
        # package.json> la crea il workflow stesso.
        description: 'Pubblica una Release con la versione di package.json'
        type: boolean
        default: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Controlli
        # Gli stessi che si lanciano in locale con `npm run check`:
        # una sola fonte di verita', niente pipeline che diverge.
        run: node scripts/check.js

      - name: Tag coerente con la versione
        # Evita release chiamate v2.1.0 che contengono eseguibili 2.0.0.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versione=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$versione" != "$tag" ]; then
            echo "::error::il tag $GITHUB_REF_NAME non corrisponde alla version $versione di package.json"
            exit 1
          fi
          echo "OK: versione $versione"

  build:
    needs: verifica
    runs-on: windows-latest
    outputs:
      versione: ${{ steps.versione.outputs.v }}
    # Solo lettura: npm ci esegue gli script di installazione delle
    # dipendenze, che non devono mai trovarsi accanto a un token capace di
    # scrivere sul repository o di pubblicare release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installazione dipendenze
        # npm ci usa package-lock.json: stesse versioni esatte della build
        # locale, nessuna sorpresa da un aggiornamento a monte.
        run: npm ci --no-audit --no-fund

      - name: Build portable + installer
        # --publish never: la Release la crea il job release, con il suo
        # token. electron-builder scrive comunque latest.yml e .blockmap,
        # perche' package.json ha la configurazione "publish".
        run: npx electron-builder --win portable nsis --publish never

      - name: Versione
        id: versione
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: latest.yml indica l'installer
        # Il programma installato si aggiorna leggendo latest.yml: se
        # indicasse il portable, o un'altra versione, i PC del reparto
        # scaricherebbero il file sbagliato.
        shell: bash
        run: |
          v="${{ steps.versione.outputs.v }}"
          cat dist/latest.yml
          grep -q "^version: $v$" dist/latest.yml || { echo "::error::latest.yml non e' della versione $v"; exit 1; }
          grep -q "^path: ER-Oncology-Archivist-$v-setup.exe$" dist/latest.yml || { echo "::error::latest.yml non indica l'installer"; exit 1; }
          test -f "dist/ER-Oncology-Archivist-$v-setup.exe.blockmap" || { echo "::error::manca il .blockmap dell'installer"; exit 1; }

      - name: Checksum SHA-256
        # Gli eseguibili non sono firmati: il checksum e' l'unico modo che
        # ha il reparto per verificare di aver scaricato il file giusto.
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Tee-Object -FilePath dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Ogni build produce ~200 MB di eseguibili e lo spazio artifact
      # incluso nel piano e' 500 MB: con 30 giorni di conservazione bastano
      # due run per esaurirlo e bloccare le Actions. Quindi gli .exe si
      # caricano solo quando servono davvero e per il tempo minimo: il job
      # release li scarica subito dopo e li allega alla release, che non
      # consuma lo spazio delle Actions.
      # Nella build manuale l'archivio demo (pazienti inventati) viaggia
      # con il setup: chi presenta il programma lo mette in una cartella e
      # la sceglie come cartella dati, senza bisogno di Node sul PC. Resta
      # fuori dalle release, che allegano solo gli eseguibili.
      - name: Archivio demo (solo build manuale)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Copy-Item "demo/ER OA Archive.json" dist/

      - name: Eseguibili (solo tag o build manuale)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ER-Oncology-Archivist-Windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/latest.yml
            dist/*.blockmap
            dist/ER OA Archive.json
          if-no-files-found: error
          # gli .exe sono gia' compressi: rizipparli e' solo tempo perso
          compression-level: 0
          retention-days: 1

      # Sui push ordinari serve solo sapere che la build passa: teniamo i
      # checksum, poche centinaia di byte invece di 200 MB.
      - name: Checksum (push su main)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ER-Oncology-Archivist-checksum
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    # Job separato: riceve solo gli eseguibili già compilati, non installa
    # nulla, e soltanto qui il token può scrivere.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.rilascia
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ER-Oncology-Archivist-Windows
          path: dist

      - name: Release scaricabile
        # Si attiva sui tag v* e con "rilascia". Usa la gh CLI gia' presente
        # sul runner: nessuna action di terze parti nella catena di build.
        # latest.yml e .blockmap servono al programma installato per
        # aggiornarsi; --latest perche' l'aggiornamento legge l'ultima Release.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # con un tag e' il tag stesso; con "rilascia" lo si ricava dalla
          # versione di package.json, cosi' non possono divergere
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.versione) }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::la Release $TAG esiste gia': aumenta version in package.json"
            exit 1
          fi
          {
            echo "## ER Oncology Archivist ${TAG}"
            echo
            echo "**Quale file scaricare**"
            echo
            echo "| file | quando usarlo |"
            echo "|---|---|"
            echo "| \`...-setup.exe\` | **l'installer da usare in reparto.** Si installa per l'utente, senza diritti di amministratore, e da quel momento il programma si aggiorna da solo. |"
            echo "| \`...-portable.exe\` | parte senza installazione (per esempio dalla share), ma **non si aggiorna da solo**. |"
            echo "| \`latest.yml\`, \`.blockmap\` | non vanno scaricati: servono al programma installato per trovare e scaricare gli aggiornamenti. |"
            echo
            echo "**Aggiornamenti.** Il programma installato controlla all'avvio e poi ogni 4 ore;"
            echo "la nuova versione si scarica in background e si installa alla chiusura, mai mentre si lavora."
            echo "Le impostazioni della postazione e l'archivio non vengono toccati."
            echo
            echo "**Gli eseguibili non sono firmati.** Al primo avvio Windows SmartScreen"
            echo "mostra \"Windows ha protetto il PC\": *Ulteriori informazioni* -> *Esegui comunque*."
            echo "Verifica prima il checksum qui sotto."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "In PowerShell: \`Get-FileHash .\\nomefile.exe -Algorithm SHA256\`"
          } > note-release.md

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            dist/*.exe dist/*.blockmap dist/latest.yml dist/SHA256SUMS.txt \
            --title "ER Oncology Archivist ${TAG}" \
            --notes-file note-release.md
